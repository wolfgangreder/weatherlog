# Firebird connection (override via env: FIREBIRD_HOST, FIREBIRD_PORT, etc.)
firebird.host=192.168.1.19
firebird.port=3051
firebird.database=weather
firebird.user=sysdba
firebird.pass=CHANGEME

# Datasource
quarkus.datasource.weather.db-kind=other
quarkus.datasource.weather.jdbc.driver=org.firebirdsql.jdbc.FBDriver
quarkus.datasource.weather.jdbc.url=jdbc:firebirdsql://${firebird.host}:${firebird.port}/${firebird.database}?charSet=UTF-8
quarkus.datasource.weather.username=${firebird.user}
quarkus.datasource.weather.password=${firebird.pass}
quarkus.datasource.weather.jdbc.min-size=2
quarkus.datasource.weather.jdbc.max-size=10

# Hibernate ORM (single default PU using named datasource)
quarkus.hibernate-orm.datasource=weather
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.FirebirdDialect
quarkus.hibernate-orm.packages=at.or.reder.weather.model
quarkus.hibernate-orm.database.generation=none

# Liquibase
quarkus.liquibase.weather.migrate-at-start=true
quarkus.liquibase.weather.change-log=at/or/reder/weather/jpa/changelog_0.0.1.xml

# HTTP
quarkus.http.port=8080

# REST base path
quarkus.resteasy.path=/weather

# Metrics
quarkus.micrometer.export.prometheus.path=/q/metrics

# Logging
quarkus.log.level=INFO
quarkus.log.category."at.or.reder".level=INFO

# Container image (build with -Dquarkus.container-image.build=true)
quarkus.container-image.registry=docker.io
quarkus.container-image.group=wolfgangreder
quarkus.container-image.name=weatherlog
quarkus.container-image.tag=${quarkus.application.version:latest}
