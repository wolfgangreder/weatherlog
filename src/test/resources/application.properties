# Use H2 in-memory for tests — avoids needing a live Firebird
%test.quarkus.datasource.weather.db-kind=h2
%test.quarkus.datasource.weather.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.weather.username=sa
%test.quarkus.datasource.weather.password=
%test.quarkus.datasource.weather.jdbc.driver=org.h2.Driver

%test.quarkus.hibernate-orm.datasource=weather
%test.quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# Disable Liquibase in tests (Hibernate generates schema)
%test.quarkus.liquibase.weather.migrate-at-start=false

# Use same REST base path
%test.quarkus.resteasy.path=/weather
