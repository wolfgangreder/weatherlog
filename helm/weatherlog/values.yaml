replicaCount: 1

image:
  repository: wolfgangreder/at.or.reder.weatherlog
  tag: "0.2.0-SNAPSHOT"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: weather.local.reder.or.at
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Names of pre-existing Secret and ConfigMap in the same namespace.
# Secret must have keys "username" and "password".
# ConfigMap must have key "database_url" (full Jaybird JDBC URL).
externalSecret:
  name: firebird-secret

externalConfig:
  name: firebird-config

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

prometheus:
  scrape: true
  path: /q/metrics
  port: "8080"

livenessProbe:
  httpGet:
    path: /q/health/live
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /q/health/ready
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 3
