replicaCount: 1

image:
  repository: weatherlog
  tag: "0.1.0-SNAPSHOT"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: weatherlog.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

firebird:
  host: "192.168.1.19"
  port: "3051"
  database: "weather"
  user: "sysdba"
  # password: set via --set firebird.password=... or external Secret
  password: "CHANGEME"

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

prometheus:
  scrape: true
  path: /q/metrics
  port: "8080"

livenessProbe:
  httpGet:
    path: /q/health/live
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /q/health/ready
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 3
